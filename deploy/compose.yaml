services:
  right-wake:
    image: right-wake:0.3.1
    pull_policy: never
    command: ["relay", "serve", "--listen", "0.0.0.0:7433"]
    env_file:
      - ./private.env
    volumes:
      - right-wake-data:/data
    ports:
      - "127.0.0.1:${RIGHT_WAKE_PORT:-7433}:7433"
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  right-wake-data:
