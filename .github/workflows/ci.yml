name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked
      - name: Local CLI and installer smoke tests
        run: sh scripts/smoke.sh target/debug/waking
      - name: Check plugin metadata
        run: python3 scripts/check-plugin.py
      - name: Audit locked dependencies against RustSec
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          cargo audit --deny warnings
