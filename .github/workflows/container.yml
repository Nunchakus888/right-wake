name: Container smoke

on:
  pull_request:
    paths:
      - .github/workflows/container.yml
      - scripts/*container*
      - scripts/compose-smoke.sh
      - deploy/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Container script contracts (no Rust rebuild)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check shell syntax and installer failure boundaries
        run: |
          for script in scripts/package-container.sh scripts/install-container.sh scripts/container-smoke.sh scripts/compose-smoke.sh; do
            sh -n "$script"
          done
          python3 scripts/test-container-installer.py

  container:
    name: Source Docker build and volume persistence (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build image and verify receiver restart and recreation
        run: sh scripts/container-smoke.sh
